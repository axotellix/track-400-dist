<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Track Measure & Pace Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #09090b;
            --track-base: #2a1010;
            --track-hover: #4a1515;
            --track-active: #7f1d1d;
            --track-highlight: #ef4444;
            --text-main: rgba(255, 255, 255, 0.9);
            --text-muted: rgba(255, 255, 255, 0.5);
            --grid-color: rgba(255, 255, 255, 0.015);
            --panel-bg: rgba(25, 25, 30, 0.6);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            background-image: radial-gradient(ellipse 70% 50% at 50% -20%, rgba(150, 20, 20, 0.12), transparent);
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            background-image: 
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 80px 80px;
            background-position: center center;
            -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 20%, transparent 100%);
            mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 20%, transparent 100%);
        }

        .container {
            position: relative;
            width: 100vw;
            max-width: 1600px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        svg {
            width: 100%;
            height: 100%;
            max-height: 85vh;
            transform: scale(1.12) translateY(-8%);
            filter: drop-shadow(0 0 30px rgba(0, 0, 0, 0.8));
            user-select: none;
            transition: viewBox 0.1s ease, transform 0.3s ease;
            touch-action: none; 
        }

        .lane-fill { fill: none; stroke: var(--track-base); transition: stroke 0.3s ease, filter 0.3s ease; cursor: crosshair; stroke-linecap: butt; }
        .lane-fill:hover { stroke: var(--track-hover); }
        .lane-fill.locked { stroke: var(--track-active); filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.2)); }
        .lane-fill.dimmed { stroke: #1a0a0a; opacity: 0.5; }
        .lane-divider { fill: none; stroke: rgba(255, 255, 255, 0.15); pointer-events: none; }
        .mark-line { stroke: rgba(255, 255, 255, 0.25); pointer-events: none; }
        .mark-text { fill: rgba(255, 255, 255, 0.5); font-weight: 600; pointer-events: none; text-anchor: middle; dominant-baseline: central; }
        #cursor-line { stroke: #ffffff; pointer-events: none; transition: stroke 0.15s ease; stroke-linecap: round; }
        #cursor-line.snapped { stroke: #60a5fa; filter: drop-shadow(0 0 5px rgba(96, 165, 250, 0.8)); }
        .highlight-segment { fill: none; stroke: var(--track-highlight); pointer-events: none; stroke-linecap: butt; filter: drop-shadow(0 0 6px rgba(239, 68, 68, 0.6)); }
        .point-marker { fill: #ffffff; pointer-events: none; filter: drop-shadow(0 0 6px rgba(255,255,255,0.9)); }

        .center-display {
            position: absolute;
            top: 43%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 20px 30px; 
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .center-display .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
        .center-display .distance { font-size: 28px; font-weight: 700; color: rgba(255, 255, 255, 0.95); font-variant-numeric: tabular-nums; line-height: 1; margin-bottom: 4px; text-shadow: 0 0 20px rgba(255, 255, 255, 0.2); transition: font-size 0.3s; }
        .center-display .hint { font-size: 11px; color: var(--text-muted); font-weight: 400; }

        .bottom-ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 10;
            width: max-content;
            max-width: 95vw;
        }

        .controls-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            box-sizing: border-box;
            border-radius: 14px; 
        }

        .calc-panel { padding: 16px 24px; flex-direction: row; align-items: center; gap: 24px; width: 100%; }
        .calc-group { display: flex; flex-direction: column; gap: 8px; }
        .calc-group label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }

        input[type="number"] {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 0 10px;
            height: 40px; 
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 16px; 
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            text-align: center;
            box-sizing: border-box;
        }

        input[type="number"]:focus { border-color: var(--track-highlight); box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2); }
        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        .input-dist { width: 80px; }
        .time-inputs { display: flex; align-items: center; gap: 4px; color: var(--text-muted); font-weight: 600; }
        .input-min, .input-sec, .input-ms { width: 45px; }
        .calc-divider { width: 1px; height: 36px; background: rgba(255,255,255,0.1); }
        .calc-result { font-size: 20px; font-weight: 700; color: var(--track-highlight); font-variant-numeric: tabular-nums; height: 40px; display: flex; align-items: center; text-shadow: 0 0 15px rgba(239, 68, 68, 0.3); }

        .slider-panel { border-radius: 100px; padding: 12px 24px; align-items: center; gap: 15px; width: 100%; justify-content: center; }
        .slider-panel label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; display: flex; align-items: center; gap: 10px; margin: 0; }
        .slider-panel span { color: white; font-variant-numeric: tabular-nums; }
        .slider-panel input[type="range"] { width: 150px; margin: 0; accent-color: var(--track-highlight); cursor: pointer; height: 20px; }

        #tooltip { position: absolute; background: rgba(0, 0, 0, 0.8); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; pointer-events: none; opacity: 0; transform: translate(-50%, -150%); transition: opacity 0.2s; backdrop-filter: blur(4px); z-index: 20; }

        /* === АДАПТИВНОСТЬ ДЛЯ ТЕЛЕФОНОВ === */
        @media (max-width: 850px) {
            body { 
                overflow-y: auto; 
                overflow-x: hidden; 
                height: auto; 
                min-height: 100vh; 
            }
            
            .container {
                justify-content: flex-start;
                height: auto;
                min-height: 100vh;
                padding-top: 5vh; 
                padding-bottom: 60px; 
            }

            svg {
                margin-top: 20%;
                transform: scale(1.1); 
                max-height: 45vh; 
                flex-shrink: 0;
            }
            
            .center-display {
                top: 4%; 
                transform: translateX(-50%); 
                padding: 10px 18px;
                width: auto;
                min-width: 140px;
                border-radius: 14px;
            }
            
            .center-display .distance { font-size: 24px; margin-bottom: 2px; }
            .center-display .hint { font-size: 10px; }
            .center-display .label { font-size: 10px; }

            .bottom-ui-container {
                position: relative;
                bottom: auto;
                left: 0;
                transform: none;
                margin-top: 35px; 
                width: 92vw;
            }

            .calc-panel {
                flex-direction: column; 
                gap: 12px;
                padding: 16px;
                align-items: stretch; 
                border-radius: 14px;
            }

            .calc-group {
                flex-direction: row; 
                justify-content: space-between;
                align-items: center;
                width: 100%;
            }

            .calc-divider { width: 100%; height: 1px; margin: 4px 0; }
            .input-dist, .time-inputs { width: 60%; justify-content: flex-end; }
            .input-dist { width: auto; min-width: 100px; }
            
            .slider-panel {
                border-radius: 14px; 
                justify-content: space-between;
            }
            .slider-panel input[type="range"] { width: 50%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <svg id="track-svg">
            <g id="g-lane-fills"></g>
            <g id="g-lane-dividers"></g>
            <g id="g-marks"></g>
            <line id="highlight-chute" class="highlight-segment" opacity="0" />
            <path id="highlight-1" class="highlight-segment" />
            <path id="highlight-2" class="highlight-segment" />
            <line id="cursor-line" x1="0" y1="0" x2="0" y2="0" opacity="0" />
            <circle id="start-marker" class="point-marker" opacity="0" />
            <circle id="finish-marker" class="point-marker" opacity="0" />
        </svg>

        <div class="center-display">
            <div class="label" id="ui-label">Дистанция</div>
            <div class="distance" id="ui-distance">0.00 м</div>
            <div class="hint" id="ui-hint">Тапните на дорожку</div>
        </div>

        <div class="bottom-ui-container">
            <div class="controls-panel calc-panel">
                <div class="calc-group">
                    <label>Дистанция (м)</label>
                    <input type="number" id="calc-dist" class="input-dist" value="400">
                </div>
                <div class="calc-group">
                    <label>Время</label>
                    <div class="time-inputs">
                        <input type="number" id="calc-min" class="input-min" value="1" placeholder="0">
                        <span>:</span>
                        <input type="number" id="calc-sec" class="input-sec" value="00" placeholder="00">
                        <span>.</span>
                        <input type="number" id="calc-ms" class="input-ms" value="00" placeholder="00">
                    </div>
                </div>
                
                <div class="calc-divider"></div>
                
                <div class="calc-group">
                    <label>Целевая (м)</label>
                    <input type="number" id="calc-target" class="input-dist" value="800">
                </div>
                <div class="calc-group">
                    <label>Прогноз времени</label>
                    <div class="calc-result" id="calc-result">2:00.00</div>
                </div>
            </div>

            <div class="controls-panel slider-panel">
                <label>
                    Ширина дорожек 
                    <span id="width-val">5.0</span>
                </label>
                <input type="range" id="width-slider" min="3.0" max="15.0" step="0.1" value="5.0">
            </div>
        </div>

        <div id="tooltip"></div>
    </div>

    <script>
        const SVG_NS = "http://www.w3.org/2000/svg";
        const STRAIGHT = 84.39, R_INNER = 36.50, MATH_LANE_W = 1.22, LANES = 8, C = STRAIGHT / 2;
        let VIS_LANE_W = 5.0; 
        let currentSliderValue = 5.0; 
        
        // 100м старт находится ровно на 100 метров от финиша (C = 42.195)
        const CHUTE_END_X = C - 100; // -57.805

        // --- КАЛЬКУЛЯТОР (Сотые доли) ---
        const iDist = document.getElementById('calc-dist'), iMin = document.getElementById('calc-min'), iSec = document.getElementById('calc-sec'), iMs = document.getElementById('calc-ms'), iTarget = document.getElementById('calc-target'), outResult = document.getElementById('calc-result');

        function calculatePace() {
            const dist = parseFloat(iDist.value) || 0;
            const m = parseInt(iMin.value) || 0;
            const s = parseInt(iSec.value) || 0;
            const ms = parseInt(iMs.value) || 0; 
            const target = parseFloat(iTarget.value) || 0;
            
            if (dist <= 0 || target <= 0) { outResult.textContent = "--:--.--"; outResult.style.color = "var(--text-muted)"; return; }
            
            const totalSec = m * 60 + s + (ms / 100); 
            const pace = totalSec / dist;
            const targetSec = pace * target;
            
            if (targetSec === 0) { outResult.textContent = "0:00.00"; return; }
            
            const outM = Math.floor(targetSec / 60);
            const outS = Math.floor(targetSec % 60);
            const outMs = Math.floor((targetSec % 1) * 100); 
            
            outResult.textContent = `${outM}:${outS.toString().padStart(2, '0')}.${outMs.toString().padStart(2, '0')}`;
            outResult.style.color = "var(--track-highlight)";
        }

        [iDist, iMin, iSec, iMs, iTarget].forEach(el => {
            el.addEventListener('input', calculatePace);
            el.addEventListener('blur', (e) => {
                if(e.target.id === 'calc-sec' && e.target.value) e.target.value = e.target.value.padStart(2, '0');
                if(e.target.id === 'calc-ms' && e.target.value) e.target.value = e.target.value.padStart(2, '0');
            });
        });
        calculatePace();

        // --- СТАДИОН ---
        const svg = document.getElementById('track-svg'), gFills = document.getElementById('g-lane-fills'), gDividers = document.getElementById('g-lane-dividers'), gMarks = document.getElementById('g-marks'), cursorLine = document.getElementById('cursor-line'), hlChute = document.getElementById('highlight-chute'), highlight1 = document.getElementById('highlight-1'), highlight2 = document.getElementById('highlight-2'), startMarker = document.getElementById('start-marker'), finishMarker = document.getElementById('finish-marker'), uiDist = document.getElementById('ui-distance'), uiHint = document.getElementById('ui-hint'), tooltip = document.getElementById('tooltip');

        let lockedLane = null, startPoint = null, finishPoint = null, activeHover = null, hasMovedAway = false; 
        const tracksData = [];

        function getTrackPath(r) { return `M ${C},${r} A ${r},${r} 0 0,0 ${C},${-r} L ${-C},${-r} A ${r},${r} 0 0,0 ${-C},${r} Z`; }

        // Точное проецирование математической дистанции в визуальные координаты SVG
        function getPos(laneObj, dMeasure) {
            if (dMeasure < 0) return { px: C + dMeasure, py: laneObj.rVis, nx: 0, ny: 1 };
            
            const lCurve = laneObj.rMeasure * Math.PI;
            let d = dMeasure % laneObj.lTotal;
            if (d < 0) d += laneObj.lTotal;
            
            let px, py, nx, ny;
            if (d < lCurve) {
                const angle = Math.PI/2 - (d / lCurve) * Math.PI;
                px = C + laneObj.rVis * Math.cos(angle); py = laneObj.rVis * Math.sin(angle); nx = Math.cos(angle); ny = Math.sin(angle);
            } else if (d < lCurve + STRAIGHT) {
                const ds = d - lCurve; px = C - ds; py = -laneObj.rVis; nx = 0; ny = -1;
            } else if (d < 2 * lCurve + STRAIGHT) {
                const ds = d - lCurve - STRAIGHT;
                const angle = -Math.PI/2 - (ds / lCurve) * Math.PI;
                px = -C + laneObj.rVis * Math.cos(angle); py = laneObj.rVis * Math.sin(angle); nx = Math.cos(angle); ny = Math.sin(angle);
            } else {
                const ds = d - 2 * lCurve - STRAIGHT; px = -C + ds; py = laneObj.rVis; nx = 0; ny = 1;
            }
            return { px, py, nx, ny };
        }

        // Обратное преобразование: из математической длины в длину кривой SVG для stroke-dasharray
        function dMeasureToDVis(laneObj, dMeasure) {
            if (dMeasure < 0) return dMeasure; 
            const lCurve = laneObj.rMeasure * Math.PI, visCurve = laneObj.rVis * Math.PI;
            let d = dMeasure % laneObj.lTotal; if (d < 0) d += laneObj.lTotal;
            
            if (d < lCurve) return (d / lCurve) * visCurve;
            else if (d < lCurve + STRAIGHT) return visCurve + (d - lCurve);
            else if (d < 2 * lCurve + STRAIGHT) return visCurve + STRAIGHT + ((d - lCurve - STRAIGHT) / lCurve) * visCurve;
            else return 2 * visCurve + STRAIGHT + (d - 2 * lCurve - STRAIGHT);
        }

        function buildTrack(sliderValue) {
            currentSliderValue = sliderValue;
            const isMobile = window.innerWidth <= 850;
            VIS_LANE_W = isMobile ? sliderValue * 3.0 : sliderValue;

            tracksData.length = 0; gFills.innerHTML = ''; gDividers.innerHTML = ''; gMarks.innerHTML = '';

            const rOutmost = R_INNER + LANES * VIS_LANE_W, padding = 30;
            const rightEdge = C + rOutmost, leftEdge = Math.min(CHUTE_END_X, -C - rOutmost), maxDistX = Math.max(Math.abs(rightEdge), Math.abs(leftEdge));
            const minX = -maxDistX - padding, widthStr = (maxDistX + padding) * 2;
            const maxDistY = rOutmost, minY = -maxDistY - padding, heightStr = (maxDistY + padding) * 2;

            svg.setAttribute('viewBox', `${minX} ${minY} ${widthStr} ${heightStr}`);
            hlChute.setAttribute('stroke-width', VIS_LANE_W); highlight1.setAttribute('stroke-width', VIS_LANE_W); highlight2.setAttribute('stroke-width', VIS_LANE_W);
            startMarker.setAttribute('r', VIS_LANE_W * 0.35); finishMarker.setAttribute('r', VIS_LANE_W * 0.35);

            for (let i = 0; i < LANES; i++) {
                const rMeasure = i === 0 ? 36.80 : 36.50 + i * MATH_LANE_W + 0.20;
                const lTotal = 2 * (rMeasure * Math.PI) + 2 * STRAIGHT, rVis = 36.50 + i * VIS_LANE_W + VIS_LANE_W / 2, visTotal = 2 * (rVis * Math.PI) + 2 * STRAIGHT;
                const laneObj = { lane: i, rMeasure, rVis, lTotal, visTotal, marks: [] };
                const addMark = (name, d) => laneObj.marks.push({ name, d });
                
                addMark("Финиш", 0); 
                addMark("100м", -100); 
                addMark("200м", lTotal - 200); 
                addMark("300м", lTotal - 300); 
                addMark("400м", lTotal - 400); 
                addMark("800м", (rMeasure - 36.80) * Math.PI); 
                addMark("1500м", lTotal - 300); 
                tracksData.push(laneObj);

                const lanePath = document.createElementNS(SVG_NS, 'path');
                lanePath.setAttribute('d', getTrackPath(rVis) + ` M ${-C},${rVis} L ${CHUTE_END_X},${rVis}`);
                lanePath.setAttribute('stroke-width', VIS_LANE_W); lanePath.classList.add('lane-fill'); lanePath.dataset.lane = i; gFills.appendChild(lanePath);

                const rOut = 36.50 + (i + 1) * VIS_LANE_W, divider = document.createElementNS(SVG_NS, 'path');
                divider.setAttribute('d', getTrackPath(rOut) + ` M ${-C},${rOut} L ${CHUTE_END_X},${rOut}`);
                divider.classList.add('lane-divider'); divider.style.strokeWidth = VIS_LANE_W * 0.05; gDividers.appendChild(divider);

                if (i === 0) {
                    const innerDivider = document.createElementNS(SVG_NS, 'path');
                    innerDivider.setAttribute('d', getTrackPath(R_INNER) + ` M ${-C},${R_INNER} L ${CHUTE_END_X},${R_INNER}`);
                    innerDivider.classList.add('lane-divider'); innerDivider.style.strokeWidth = VIS_LANE_W * 0.05; gDividers.appendChild(innerDivider);
                }

                laneObj.marks.forEach(mark => {
                    const pos = getPos(laneObj, mark.d), line = document.createElementNS(SVG_NS, 'line');
                    line.setAttribute('x1', pos.px - pos.nx * (VIS_LANE_W / 2.2)); line.setAttribute('y1', pos.py - pos.ny * (VIS_LANE_W / 2.2));
                    line.setAttribute('x2', pos.px + pos.nx * (VIS_LANE_W / 2.2)); line.setAttribute('y2', pos.py + pos.ny * (VIS_LANE_W / 2.2));
                    line.classList.add('mark-line'); line.style.strokeWidth = VIS_LANE_W * 0.14; gMarks.appendChild(line);

                    if (mark.name === "Финиш") {
                        const text = document.createElementNS(SVG_NS, 'text');
                        text.setAttribute('x', pos.px); text.setAttribute('y', pos.py); text.textContent = i + 1; text.classList.add('mark-text'); text.style.fontSize = (VIS_LANE_W * 0.6) + 'px'; 
                        text.setAttribute('transform', `rotate(90, ${pos.px}, ${pos.py}) translate(0, 0)`); gMarks.appendChild(text);
                    }
                });
            }
            startPoint = null; finishPoint = null; lockedLane = null; activeHover = null; hasMovedAway = false; updateUI();
        }

        const pt = svg.createSVGPoint();
        
        // НОВЫЙ 100% ТОЧНЫЙ ГЕОМЕТРИЧЕСКИЙ РАСЧЕТ КЛИКА
        function getMouseData(e) {
            pt.x = e.clientX; pt.y = e.clientY;
            const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
            const mx = svgP.x, my = svgP.y;

            let minDist = Infinity;
            let bestLane = -1;
            let bestSegment = null;

            const lanesToCheck = (lockedLane !== null) ? [lockedLane] : [0, 1, 2, 3, 4, 5, 6, 7];

            for (let i of lanesToCheck) {
                const laneObj = tracksData[i];
                const rVis = laneObj.rVis;
                let d;

                // 1. Правый вираж
                if (mx > C) {
                    d = Math.abs(Math.sqrt((mx - C)**2 + my**2) - rVis);
                    if (d < minDist) { minDist = d; bestLane = i; bestSegment = 'RIGHT_CURVE'; }
                }
                // 2. Левый вираж
                if (mx < -C) {
                    d = Math.abs(Math.sqrt((mx + C)**2 + my**2) - rVis);
                    if (d < minDist) { minDist = d; bestLane = i; bestSegment = 'LEFT_CURVE'; }
                }
                // 3. Верхняя прямая
                if (mx >= -C && mx <= C && my <= 0) {
                    d = Math.abs(my - (-rVis));
                    if (d < minDist) { minDist = d; bestLane = i; bestSegment = 'TOP_STRAIGHT'; }
                }
                // 4. Нижняя прямая
                if (mx >= -C && mx <= C && my > 0) {
                    d = Math.abs(my - rVis);
                    if (d < minDist) { minDist = d; bestLane = i; bestSegment = 'BOTTOM_STRAIGHT'; }
                }
                // 5. Аппендикс 100м
                if (mx < -C && my > 0) {
                    if (mx >= CHUTE_END_X) d = Math.abs(my - rVis);
                    else d = Math.sqrt((mx - CHUTE_END_X)**2 + (my - rVis)**2);
                    if (d < minDist) { minDist = d; bestLane = i; bestSegment = 'CHUTE'; }
                }
            }

            if (bestLane === -1) return null;

            const laneObj = tracksData[bestLane];
            const lCrvMeasure = laneObj.rMeasure * Math.PI;
            let dMeasure = 0;

            // Расчет идеальной математической дистанции для выбранного сегмента
            if (bestSegment === 'CHUTE') {
                dMeasure = -(C - Math.max(mx, CHUTE_END_X)); 
            } else if (bestSegment === 'RIGHT_CURVE') {
                let angle = Math.atan2(my, mx - C);
                if (angle < -Math.PI/2) angle += 2*Math.PI;
                const frac = (Math.PI/2 - angle) / Math.PI;
                dMeasure = frac * lCrvMeasure;
            } else if (bestSegment === 'TOP_STRAIGHT') {
                dMeasure = lCrvMeasure + (C - mx);
            } else if (bestSegment === 'LEFT_CURVE') {
                let angle = Math.atan2(my, mx + C);
                if (angle > 0) angle -= 2 * Math.PI;
                const frac = (-Math.PI/2 - angle) / Math.PI;
                dMeasure = lCrvMeasure + STRAIGHT + frac * lCrvMeasure;
            } else if (bestSegment === 'BOTTOM_STRAIGHT') {
                dMeasure = 2 * lCrvMeasure + STRAIGHT + (mx - (-C));
            }

            // Магнитная привязка к стандартным отметкам
            let snappedMark = null;
            for (let m of laneObj.marks) {
                if (m.d < 0 && dMeasure < 0) { 
                    if (Math.abs(dMeasure - m.d) < 3.5) { dMeasure = m.d; snappedMark = m.name; break; } 
                } else if (m.d >= 0 && dMeasure >= 0) { 
                    let diff = Math.abs(dMeasure - m.d); 
                    if (diff > laneObj.lTotal / 2) diff = laneObj.lTotal - diff; 
                    if (diff < 3.5) { dMeasure = m.d; snappedMark = m.name; break; } 
                }
            }

            return { lane: bestLane, d: dMeasure, snappedMark };
        }

        function updateUI() {
            document.querySelectorAll('.lane-fill').forEach((el, i) => {
                if (lockedLane !== null) { el.classList.toggle('locked', i === lockedLane); el.classList.toggle('dimmed', i !== lockedLane); }
                else if (activeHover) { el.classList.toggle('locked', i === activeHover.lane); el.classList.toggle('dimmed', i !== activeHover.lane); }
                else el.classList.remove('locked', 'dimmed');
            });

            if (activeHover && !finishPoint) {
                const pos = getPos(tracksData[activeHover.lane], activeHover.d);
                cursorLine.setAttribute('x1', pos.px - pos.nx * (VIS_LANE_W / 2)); cursorLine.setAttribute('y1', pos.py - pos.ny * (VIS_LANE_W / 2)); cursorLine.setAttribute('x2', pos.px + pos.nx * (VIS_LANE_W / 2)); cursorLine.setAttribute('y2', pos.py + pos.ny * (VIS_LANE_W / 2));
                cursorLine.setAttribute('opacity', 1); cursorLine.style.strokeWidth = activeHover.snappedMark ? (VIS_LANE_W * 0.28) : (VIS_LANE_W * 0.11); cursorLine.className.baseVal = activeHover.snappedMark ? 'snapped' : '';
            } else cursorLine.setAttribute('opacity', 0);

            if (startPoint) { const p = getPos(tracksData[startPoint.lane], startPoint.d); startMarker.setAttribute('cx', p.px); startMarker.setAttribute('cy', p.py); startMarker.setAttribute('opacity', 1); } else startMarker.setAttribute('opacity', 0);
            if (finishPoint) { const p = getPos(tracksData[finishPoint.lane], finishPoint.d); finishMarker.setAttribute('cx', p.px); finishMarker.setAttribute('cy', p.py); finishMarker.setAttribute('opacity', 1); } else finishMarker.setAttribute('opacity', 0);

            if (startPoint) {
                const lane = startPoint.lane, tObj = tracksData[lane];
                const endD = finishPoint ? finishPoint.d : (activeHover ? activeHover.d : startPoint.d);
                let dist = endD - startPoint.d;
                while (dist < 0) dist += tObj.lTotal;
                if (dist < 0.1 && hasMovedAway && startPoint.d >= 0) dist = tObj.lTotal;

                uiDist.textContent = dist.toFixed(2) + ' м';
                uiHint.textContent = finishPoint ? "Кликните чтобы сбросить" : "Укажите точку финиша";

                if (finishPoint && dist > 0) { iDist.value = Math.round(dist); calculatePace(); }

                if (startPoint.d < 0 || endD < 0) {
                    const sChute = Math.min(0, startPoint.d), eChute = Math.min(0, endD);
                    if (sChute !== eChute) {
                        const p1 = getPos(tObj, sChute), p2 = getPos(tObj, eChute);
                        hlChute.setAttribute('x1', p1.px); hlChute.setAttribute('y1', p1.py); hlChute.setAttribute('x2', p2.px); hlChute.setAttribute('y2', p2.py); hlChute.setAttribute('opacity', 1);
                    } else hlChute.setAttribute('opacity', 0);
                } else hlChute.setAttribute('opacity', 0);

                const ovalStartD = Math.max(0, startPoint.d), ovalEndD = Math.max(0, endD);
                if (ovalStartD !== ovalEndD || dist >= tObj.lTotal - 0.1) {
                    const startVis = dMeasureToDVis(tObj, ovalStartD); 
                    let len;
                    if (dist >= tObj.lTotal - 0.1) len = tObj.visTotal; 
                    else { const endVis = dMeasureToDVis(tObj, ovalEndD); len = endVis - startVis; if (len < 0) len += tObj.visTotal; }
                    
                    const pathStr = getTrackPath(36.50 + lane * VIS_LANE_W + VIS_LANE_W / 2);
                    highlight1.setAttribute('d', pathStr); highlight1.setAttribute('stroke-dasharray', `${len} 999999`); highlight1.setAttribute('stroke-dashoffset', `-${startVis}`);
                    if (startVis + len > tObj.visTotal) { highlight2.setAttribute('d', pathStr); highlight2.setAttribute('stroke-dasharray', `${(startVis + len) - tObj.visTotal} 999999`); highlight2.setAttribute('stroke-dashoffset', `0`); } 
                    else highlight2.setAttribute('stroke-dasharray', `0 999999`);
                } else { highlight1.setAttribute('stroke-dasharray', `0 999999`); highlight2.setAttribute('stroke-dasharray', `0 999999`); }
            } else {
                uiDist.textContent = '0.00 м'; uiHint.textContent = 'Тапните на дорожку'; hlChute.setAttribute('opacity', 0); highlight1.setAttribute('stroke-dasharray', `0 999999`); highlight2.setAttribute('stroke-dasharray', `0 999999`);
            }
        }

        buildTrack(currentSliderValue);
        window.addEventListener('resize', () => { buildTrack(currentSliderValue); });

        const slider = document.getElementById('width-slider'), sliderVal = document.getElementById('width-val');
        slider.addEventListener('input', (e) => { const val = parseFloat(e.target.value); sliderVal.textContent = val.toFixed(1); buildTrack(val); });

        svg.addEventListener('mousemove', (e) => {
            activeHover = getMouseData(e);
            if (startPoint && !finishPoint && activeHover) {
                let currentDist = activeHover.d - startPoint.d; while (currentDist < 0) currentDist += tracksData[startPoint.lane].lTotal;
                if (currentDist > 15 && currentDist < tracksData[startPoint.lane].lTotal - 15) hasMovedAway = true;
            }
            if (activeHover && activeHover.snappedMark && !finishPoint) { tooltip.style.opacity = 1; tooltip.style.left = e.clientX + 'px'; tooltip.style.top = (e.clientY - 15) + 'px'; tooltip.textContent = `Стандарт: ${activeHover.snappedMark}`; } 
            else tooltip.style.opacity = 0;
            updateUI();
        });
        svg.addEventListener('mouseleave', () => { activeHover = null; tooltip.style.opacity = 0; updateUI(); });

        svg.addEventListener('click', (e) => {
            const clickData = getMouseData(e); 
            const targetData = clickData || activeHover;

            if (!targetData && lockedLane === null) return;
            
            if (!startPoint) { startPoint = { ...targetData }; lockedLane = startPoint.lane; hasMovedAway = false; }
            else if (!finishPoint) { finishPoint = { ...targetData }; }
            else {
                startPoint = null; finishPoint = null; lockedLane = null; hasMovedAway = false;
                if (targetData) { startPoint = { ...targetData }; lockedLane = startPoint.lane; }
            }
            tooltip.style.opacity = 0; updateUI();
        });
    </script>
</body>
</html>
